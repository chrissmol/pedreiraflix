name: CI

# Real gate, not decoration: this is what was missing for "a commit can't reach production if it breaks
# something fundamental" (nothing in this project stopped that before — deploy has always been `npm run
# deploy` run by hand). This workflow doesn't deploy anything itself; see deploy.yml for that, which only
# runs after this one is green.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '.claude/**', '.agents/**', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', '.claude/**', '.agents/**', 'docs/**']

# Push novo no mesmo PR (ou na main) cancela a execucao anterior: os minutos
# gratis do GitHub Actions acabaram em 2026-10-10. O deploy.yml so roda com CI
# verde, entao uma execucao cancelada nunca publica; a seguinte publica a main nova.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

      # O Worker serve todo o video (proxy de API e stream) e nao tinha teste automatico nenhum.
      - name: Proxy tests
        run: npm run test:proxy

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          # The reporter is `list` only (playwright.config.ts) — there's no playwright-report/ HTML
          # report to upload. test-results/ is what actually exists on a failing run: a per-test trace
          # (`npx playwright show-trace <file>.zip`) and screenshot for whatever failed.
          path: test-results/
          retention-days: 14
