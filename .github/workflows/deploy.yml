name: Deploy

# Runs only after CI (ci.yml) finishes successfully on main — `workflow_run` instead of its own `push`
# trigger specifically so this can never deploy code that hasn't passed lint/typecheck/build/e2e, even if
# someone pushes straight to main. Needs a `CLOUDFLARE_API_TOKEN` repo secret to actually deploy (Settings
# > Secrets and variables > Actions on GitHub; the token itself comes from the Cloudflare dashboard > My
# Profile > API Tokens > Create Token > "Edit Cloudflare Workers" template). Without it this job just
# fails at the wrangler step with a clear auth error — it doesn't silently no-op.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Confere o site no ar (headers, PWA, proxy e se os secrets existem). Nao desfaz o deploy; so fica vermelho.
      - name: Checar producao
        run: node scripts/checar-producao.mjs
