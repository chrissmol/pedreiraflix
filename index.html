<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores the SVG/manifest icons for "Add to Home Screen" and only honors this. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06070c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PedreiraFlix" />
    <meta name="application-name" content="PedreiraFlix" />
    <!-- Windows: pin-to-Start tile color/icon (Edge/Chromium installs otherwise follow the manifest). -->
    <meta name="msapplication-TileColor" content="#06070c" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- No Google Fonts anymore: the app uses each platform's native system font (real San Francisco on
         Apple devices) instead of a downloaded webfont — see the --font-sans/--font-display comment in
         index.css. One less network request on every load, and Apple doesn't license SF Pro for general
         web embedding anyway. -->
    <title>PedreiraFlix</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
